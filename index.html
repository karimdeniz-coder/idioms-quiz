<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idiom Emergency</title>
<meta name="description" content="An English idioms quiz in three rounds, with a live leaderboard.">
<meta name="theme-color" content="#140f33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#140f33; --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12); --line:rgba(255,255,255,.14);
  --ink:#f4f2ff; --muted:#b4aedb; --dim:#7f79a8;
  --yellow:#ffd23f; --pink:#ff4fa3; --orange:#ff8a3d; --violet:#8b5cff; --cyan:#22d3ee; --green:#2ee59d; --red:#ff5c7a; --blue:#4f8cff;
  --g1:linear-gradient(135deg,#ff4fa3,#ff8a3d);
  --g2:linear-gradient(135deg,#2ee59d,#22b8cf);
  --g3:linear-gradient(135deg,#4f8cff,#8b5cff);
  --gold:linear-gradient(180deg,#ffe58a,#ffc21a); --silver:linear-gradient(180deg,#f2f4fb,#bfc6dc); --bronze:linear-gradient(180deg,#f7c39b,#d98a52);
  --f-display:"Unbounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1.2);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;overflow-x:hidden;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(110px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(80px);opacity:.38;animation:float 22s ease-in-out infinite alternate}
.blobs i:nth-child(1){background:#ff4fa3;left:-12vmax;top:-14vmax}
.blobs i:nth-child(2){background:#4f8cff;right:-14vmax;top:10vmax;animation-delay:-7s}
.blobs i:nth-child(3){background:#2ee59d;left:20vmax;bottom:-20vmax;opacity:.22;animation-delay:-13s}
@keyframes float{to{transform:translate(6vmax,4vmax) scale(1.12)}}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.hidden{display:none!important}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,4vw,30px);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn{border:0;border-radius:14px;padding:13px 22px;font-weight:700;font-size:16px;background:var(--yellow);color:#231a00;box-shadow:0 4px 0 #b88f00;transition:transform .12s var(--ease),box-shadow .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b88f00}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 4px 0 #b88f00}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:8px 14px;font-size:14px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.av-img{display:block;border-radius:50%;background:var(--glass2)}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo .dot{width:12px;height:12px;border-radius:50%;background:var(--g1);box-shadow:0 0 14px #ff4fa3}
.logo span{background:linear-gradient(90deg,#ffd23f,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
.spacer{flex:1}
.chipstat{display:inline-flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chipstat .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--glass2)}
.chipstat.player{padding-left:4px}
#scoreVal.pop{animation:pop .45s var(--ease)}
@keyframes pop{40%{transform:scale(1.5)}}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.step{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.step .n{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-size:12px;background:var(--glass2);color:var(--ink)}
.step span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.now{color:var(--ink);border-color:transparent;background:var(--sg)}
.step.now .n{background:rgba(0,0,0,.25)}
.step.done{color:var(--ink)}
.step.done .n{background:var(--green);color:#06301f}
@media(max-width:520px){.step span:last-child{display:none}.step{justify-content:center}}
.exitbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(255,92,122,.12);border:1px solid rgba(255,92,122,.4);border-radius:14px;padding:10px 14px;font-size:15px}

/* ---------- Welcome ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.hero h1{font-size:clamp(34px,8vw,64px)}
.hero h1 b{display:block;background:linear-gradient(90deg,#ffd23f,#ff8a3d 45%,#ff4fa3);-webkit-background-clip:text;background-clip:text;color:transparent}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fact{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;background:var(--glass2)}
.preview{display:grid;justify-items:center;gap:8px;text-align:center}
.preview .ring{padding:5px;border-radius:50%;background:conic-gradient(from 0deg,#ffd23f,#ff4fa3,#8b5cff,#22d3ee,#2ee59d,#ffd23f);animation:spin 6s linear infinite}
.preview .ring > *{animation:spin 6s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.preview .ring img{width:112px;height:112px;border:4px solid var(--bg)}
.preview .nm{font-family:var(--f-display);font-weight:800;font-size:16px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:600px){.hero{grid-template-columns:1fr}.preview{order:-1}}
.form{display:grid;gap:16px;margin-top:22px}
.name-in{width:100%;font:inherit;font-size:20px;font-weight:700;color:var(--ink);background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:14px;padding:13px 16px}
.name-in:focus{border-color:var(--yellow);outline:none}
.av-tabs{display:flex;gap:6px;flex-wrap:wrap}
.av-tab{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.av-tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:10px}
.avatar{aspect-ratio:1;border-radius:18px;border:2px solid transparent;background:var(--glass);padding:4px;transition:transform .15s var(--ease)}
.avatar img{width:100%;height:100%;border-radius:14px;display:block}
.avatar:hover{transform:translateY(-3px) rotate(-3deg)}
.avatar[aria-pressed="true"]{border-color:var(--yellow);background:rgba(255,210,63,.18);transform:scale(1.05)}

/* ---------- Round frame ---------- */
.rhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.rbadge{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:26px;background:var(--rg);box-shadow:0 8px 24px -8px rgba(0,0,0,.6)}
.rhead h2{font-size:clamp(20px,4vw,28px)}
.rhead p{margin:4px 0 0;color:var(--muted);font-size:15px}
.rpts{font-family:var(--f-display);font-weight:800;font-size:26px;text-align:right;font-variant-numeric:tabular-nums}
.rpts small{color:var(--dim);font-weight:600}
.stage{margin-top:18px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(20,15,51,0),rgba(20,15,51,.92) 35%)}
.actionbar .in{max-width:900px;margin:0 auto;display:flex;gap:12px;align-items:center;background:rgba(30,24,70,.85);border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.actionbar .hint{flex:1;color:var(--muted);font-size:14px;min-width:0}
.meter{height:6px;border-radius:6px;background:var(--glass2);overflow:hidden;margin-top:6px;max-width:220px}
.meter b{display:block;height:100%;width:0;background:var(--rg);transition:width .35s var(--ease)}
.roundscore{font-family:var(--f-display);font-weight:800;font-size:22px}

/* Correction marks */
.yours{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2.5px;color:#ffb2c1}
.fix{color:var(--green);font-weight:700}
.fix::before{content:"→ ";color:var(--dim);font-weight:400}
.okword{color:var(--green);font-weight:700}
.verdict{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.verdict.ok{color:var(--green)} .verdict.no{color:var(--red)}
.reveal{opacity:0;transform:translateY(8px) scale(.98)}
.reveal.on{opacity:1;transform:none;transition:opacity .35s, transform .45s var(--ease)}
.plus{position:absolute;right:10px;top:8px;font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--green);animation:plus 1s ease-out forwards}
@keyframes plus{from{opacity:0;transform:translateY(6px)}30%{opacity:1}to{opacity:0;transform:translateY(-18px)}}

/* ---------- Round 1 ---------- */
.ig{display:grid;grid-template-columns:minmax(0,400px);justify-content:center;gap:12px}
.tray{display:flex;gap:8px;justify-content:safe center;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.tbtn{flex:none;display:grid;justify-items:center;gap:4px;border:0;background:none;width:58px;padding:0}
.tring{width:54px;height:54px;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);transition:transform .2s var(--ease)}
.tring img{width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);background:#fff;display:block}
.tbtn.seen .tring{background:rgba(255,255,255,.22)}
.tbtn.cur .tring{transform:scale(1.1)}
.tbtn small{font-size:10.5px;color:var(--muted);max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn.seen small{color:var(--green)}
.viewer{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:9/16;max-height:max(430px,calc(100dvh - 390px));min-height:430px;width:100%;display:flex;flex-direction:column;box-shadow:0 30px 70px -30px rgba(0,0,0,.9)}
.vbg{position:absolute;inset:0;background:var(--sg)}
.vbg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 20% 0%,rgba(255,255,255,.28),transparent 55%),radial-gradient(90% 60% at 100% 100%,rgba(0,0,0,.35),transparent 60%)}
.vtop{position:relative;z-index:3;padding:10px 10px 0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent)}
.bars{display:flex;gap:4px}
.bars i{flex:1;height:2.5px;border-radius:3px;background:rgba(255,255,255,.4);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:#fff}
.bars i.full b{width:100%}
.bars i.cur b{animation:fill 8s linear forwards}
@keyframes fill{to{width:100%}}
.vhead{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:14px;padding-bottom:6px}
.vhead img{width:32px;height:32px;border-radius:50%;background:#fff}
.vhead b{font-weight:700}
.vhead small{color:rgba(255,255,255,.75)}
.vhead .more{margin-left:auto;font-size:18px;letter-spacing:2px;opacity:.9}
.vmid{position:relative;z-index:1;flex:1;display:grid;place-items:center;padding:18px}
.qst{width:min(86%,300px);border-radius:20px;background:#fff;color:#141414;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.35);position:relative;padding:34px 16px 18px;transform:rotate(-2.5deg)}
.qst .qa{position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;border:3px solid #fff;background:#fff}
.qst .qt{font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;background:var(--sg);-webkit-background-clip:text;background-clip:text;color:transparent}
.qst .qe{font-size:clamp(40px,11vw,52px);margin:10px 0 10px;line-height:1.2;letter-spacing:.04em}
.qst .qh{font-size:13px;color:#555;background:#f1f1f4;border-radius:999px;padding:5px 12px;display:inline-block}
.snav{position:absolute;z-index:2;top:80px;bottom:80px;width:28%;border:0;background:transparent}
.snav.prev{left:0}.snav.next{right:0}
.vbottom{position:relative;z-index:3;display:flex;gap:6px;align-items:center;padding:10px 10px 14px;background:linear-gradient(0deg,rgba(0,0,0,.4),transparent)}
.vbottom input{flex:1;min-width:0;font:inherit;font-size:16px;color:#fff;background:transparent;border:1.5px solid rgba(255,255,255,.8);border-radius:999px;padding:10px 16px}
.vbottom input::placeholder{color:rgba(255,255,255,.85)}
.vbottom input:focus{outline:none;background:rgba(0,0,0,.25)}
.vicon{flex:none;border:0;background:none;color:#fff;font-size:22px;width:38px;height:38px;display:grid;place-items:center;padding:0}
.vicon.heart.on{color:#ff3b5c;animation:pop .4s var(--ease)}
.floaty{position:absolute;z-index:4;bottom:64px;font-size:28px;animation:floaty 1.3s ease-out forwards;pointer-events:none}
@keyframes floaty{to{transform:translateY(-240px) scale(1.5) rotate(12deg);opacity:0}}
.sent{position:absolute;z-index:4;left:50%;bottom:76px;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;font-weight:700;border-radius:999px;padding:7px 14px;font-size:14px;animation:sent 1s ease-out forwards;pointer-events:none}
@keyframes sent{from{opacity:0;transform:translate(-50%,10px)}25%{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-30px)}}
.slide-l{animation:slideL .38s var(--ease)} .slide-r{animation:slideR .38s var(--ease)}
@keyframes slideL{from{transform:translateX(40px) scale(.97);opacity:.2}}
@keyframes slideR{from{transform:translateX(-40px) scale(.97);opacity:.2}}
.r1res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:640px){.r1res{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:400px){.r1res{grid-template-columns:1fr}}
.r1card{position:relative;border-radius:18px;padding:12px;background:var(--glass);border:1px solid var(--line);display:grid;gap:6px;min-width:0}
.r1card .who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.r1card .who img{width:22px;height:22px}
.r1card .e{font-size:32px;text-align:center}
.r1card.ok{border-color:var(--green)} .r1card.no{border-color:var(--red)}

/* ---------- Round 2 ---------- */
.handset{max-width:430px;margin:0 auto;border-radius:38px;padding:9px;background:#05040f;border:1px solid var(--line);box-shadow:0 30px 70px -30px rgba(0,0,0,.9)}
.screen{border-radius:30px;overflow:hidden;background:#0e1621;display:flex;flex-direction:column}
.ctop{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#17212b}
.ctop .back{font-size:20px;color:#6ab7ff}
.gavs{display:flex}
.gavs img{width:32px;height:32px;border:2px solid #17212b;margin-left:-10px;background:#fff}
.gavs img:first-child{margin-left:0}
.ctitle{min-width:0}
.ctitle b{display:block;font-size:15px}
.ctitle small{font-size:12px;color:#8a9bb0;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctitle small.typing-on{color:#6ab7ff}
.cbody{height:clamp(260px,calc(100dvh - 470px),480px);overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px;background-color:#0e1621;background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.2px);background-size:18px 18px}
.cbody.static{height:auto;max-height:none}
.daychip{align-self:center;background:rgba(0,0,0,.35);color:#cfd8e3;font-size:12px;border-radius:999px;padding:3px 10px;margin:2px 0 6px}
.msgrow{display:flex;gap:6px;align-items:flex-end;animation:msgin .32s var(--ease) both}
.msgrow.me{flex-direction:row-reverse}
.msgrow > img{width:28px;height:28px;flex:none;background:#fff}
@keyframes msgin{from{opacity:0;transform:translateY(12px) scale(.96)}}
.msg{max-width:82%;padding:7px 11px 5px;border-radius:16px 16px 16px 4px;background:#182533;min-width:0}
.msgrow.me .msg{background:#2b5278;border-radius:16px 16px 4px 16px}
.msg .who{font-size:12px;font-weight:700;color:var(--c)}
.msg .txt{font-size:15.5px;line-height:1.8}
.msg .time{font-size:11px;color:rgba(255,255,255,.5);text-align:right}
.msg .time .ticks{color:#6ab7ff;margin-left:3px}
.typing{display:inline-flex;gap:4px;padding:12px 14px;border-radius:16px 16px 16px 4px;background:#182533}
.typing i{width:7px;height:7px;border-radius:50%;background:#8a9bb0;animation:dots 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dots{50%{transform:translateY(-4px);opacity:.5}}
.waitnote{align-self:center;font-size:12px;font-weight:700;color:#231a00;background:var(--yellow);border-radius:999px;padding:4px 12px;margin:4px 0;animation:wn 1.2s ease-in-out infinite alternate}
@keyframes wn{to{transform:scale(1.05)}}
.gap{display:inline-flex;align-items:center;gap:6px;min-width:7.5em;justify-content:center;border:2px dashed rgba(255,255,255,.45);background:rgba(0,0,0,.18);border-radius:10px;padding:0 10px;font-weight:700;font-size:15px;line-height:1.7;vertical-align:baseline;color:#fff;transition:background .2s,border-color .2s,transform .2s var(--ease)}
.gap .gn{font-family:var(--f-display);font-size:10px;opacity:.7}
.gap.active{border-color:var(--yellow);background:rgba(255,210,63,.18);box-shadow:0 0 0 4px rgba(255,210,63,.18)}
.gap.hot{transform:scale(1.08);border-color:var(--yellow);background:rgba(255,210,63,.32)}
.gap.filled{border-style:solid;border-color:transparent;background:var(--c)}
.gap.bump{animation:bump .4s var(--ease)}
@keyframes bump{40%{transform:scale(1.15)}}
.gapmark{display:inline-flex;flex-direction:column;vertical-align:middle;line-height:1.25;margin:0 2px;font-size:15px;padding:2px 8px;border-radius:8px;background:rgba(0,0,0,.25)}
.gapmark.ok{background:rgba(46,229,157,.18)}
.sugs2{padding:8px 10px 4px;background:#17212b;border-top:1px solid rgba(255,255,255,.06)}
.sugs2 .label{font-size:10px;margin-bottom:6px;color:#8a9bb0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;border:0;border-radius:999px;padding:7px 12px;font-weight:700;font-size:13.5px;color:#fff;background:var(--c);box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .15s var(--ease),opacity .2s}
.chip:hover{transform:translateY(-2px)}
.chip.used{opacity:.25;transform:scale(.94)}
.sugs2.wait{animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:inset 0 0 0 2px var(--yellow),0 -8px 24px -8px rgba(255,210,63,.45)}}
.cinput{display:flex;gap:8px;align-items:center;padding:8px 12px 12px;background:#17212b}
.cinput .fake{flex:1;background:#0e1621;border-radius:999px;padding:9px 14px;color:#6c7c90;font-size:14px}
.cinput .mic{width:38px;height:38px;border-radius:50%;background:#2b5278;display:grid;place-items:center;font-size:16px}
.dragghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg) scale(1.1);box-shadow:0 14px 30px rgba(0,0,0,.5)}
.flyer{position:fixed;z-index:60;pointer-events:none;transition:transform .42s var(--ease),opacity .42s}

function toast(t){ const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1900); }
const fmt = ms => { const s = Math.floor(ms/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };
const total = () => game.scores.reduce((a,b)=>a+(b||0),0);

function boom(big){ if(REDUCED || typeof confetti!=="function") return; confetti({ particleCount: big?160:70, spread: big?100:70, origin:{ y: .65 }, colors:["#ffd23f","#ff4fa3","#22d3ee","#2ee59d","#8b5cff"] }); }

/* ================= GAME ================= */
function startGame(){
  game = { step:0, scores:[null,null,null], r1:Array(6).fill(""), r1i:0, r2:Array(7).fill(null), r2a:0, r3:Array(8).fill(null), r3i:0, r2wait:null, r2done:false, token:0, t0:Date.now(), tEnd:null, myId:null, checking:false };
  hud(true); $("#scoreVal").textContent = "0"; tick();
  clearInterval(timerId); timerId = setInterval(tick, 500);
  show("sGame"); mountRound();
}
function renderSteps(){
  $("#steps").innerHTML = ROUNDS.map((r,i) => `<div class="step ${game.scores[i]!==null?"done":""} ${i===game.step?"now":""}" style="--sg:${r.g}"><span class="n">${game.scores[i]!==null?"✓":i+1}</span><span>${r.title}</span></div>`).join("");
}
function mountRound(){
  game.token = Math.random();
  renderSteps();
  const r = ROUNDS[game.step];
  $("#rhead").innerHTML = `<div class="rbadge" style="--rg:${r.g}">${r.icon}</div>
    <div><div class="label">Round ${game.step+1} of 3</div><h2>${r.title}</h2><p>${r.text}</p></div>
    <div class="rpts" id="rpts">–<small>/${r.pts}</small></div>`;
  $("#abMeter").style.setProperty("--rg", r.g); $("#abMeter").style.background = r.g;
  const st = $("#stage"); st.innerHTML = "";
  [mountR1, mountR2, mountR3][game.step](st);
  setAction("check");
  window.scrollTo({top:0,behavior:"auto"});
  const fit = $("#viewer") || $(".handset");
  if(fit) setTimeout(() => fitAbove(fit), 80);
}
function fitAbove(el){
  const bar = $("#actionbar .in"); if(!el || !bar || $("#actionbar").classList.contains("hidden")) return;
  const over = el.getBoundingClientRect().bottom - bar.getBoundingClientRect().top + 12;
  if(over > 0) window.scrollBy({ top: over, behavior: REDUCED ? "auto" : "smooth" });
}
function progress(done, of, hint){
  $("#abHint").textContent = hint || `${done}/${of} done`;
  $("#abMeter").style.width = `${Math.round(done/of*100)}%`;
  if(!game.checking && game.scores[game.step]===null) $("#abBtn").disabled = done < of;
}
function setAction(mode){
  const b = $("#abBtn");
  if(mode==="check"){ b.textContent = "Check answers"; b.onclick = check; }
  else { b.disabled = false; b.textContent = game.step<2 ? "Next round →" : "See results 🏁"; b.onclick = nextRound; }
}
async function check(){
  if(game.checking) return; game.checking = true; $("#abBtn").disabled = true;
  const results = [checkR1, checkR2, checkR3][game.step]();
  const st = $("#stage"); st.innerHTML = "";
  const pts = results.filter(x => x.ok).length;
  game.scores[game.step] = 0;
  await [revealR1, revealR2, revealR3][game.step](st, results, () => { game.scores[game.step]++; bumpScore(); $("#rpts").innerHTML = `${game.scores[game.step]}<small>/${ROUNDS[game.step].pts}</small>`; });
  game.scores[game.step] = pts; $("#rpts").innerHTML = `${pts}<small>/${ROUNDS[game.step].pts}</small>`; bumpScore();
  if(pts === ROUNDS[game.step].pts) boom(false);
  $("#abHint").textContent = `Round score: ${pts}/${ROUNDS[game.step].pts}`; $("#abMeter").style.width = `${pts/ROUNDS[game.step].pts*100}%`;
  renderSteps(); game.checking = false; setAction("next");
}
function nextRound(){ if(game.step<2){ game.step++; mountRound(); } else finish(); }

/* ---------- Round 1: Story Replies ---------- */

function r1Progress(){

}
function showStory(i, first){

  const s = R1[i], el = $("#viewer");

  el.innerHTML = `<div class="vbg"></div>
    <div class="vtop"><div class="bars">${R1.map((_,j)=>`<i class="${j<i||game.r1[j].trim()?"full":""} ${j===i&&!game.r1[j].trim()?"cur":""}"><b></b></i>`).join("")}</div>
      <div class="vhead"><img src="${avURL(s.by[1],64)}" alt=""><b>${esc(s.by[0])}</b><small>${s.ago}</small><span class="more">···</span></div></div>

    <form class="vbottom" id="vreply"><input id="r1in" value="${esc(game.r1[i])}" placeholder="Reply to ${esc(s.by[0])}…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer for story ${i+1}">
      <button type="button" class="vicon heart" id="likeBtn" aria-label="Like">♡</button><button class="vicon" aria-label="Send">➤</button></form>`;
  if(!first){ el.classList.remove("slide-l","slide-r"); void el.offsetWidth; el.classList.add(dir); }
  el.querySelector(".prev").onclick = () => showStory(Math.max(0,i-1));

  const inp = $("#r1in");

  $("#vreply").addEventListener("submit", e => {

    const sent = document.createElement("div"); sent.className = "sent"; sent.textContent = "Message sent"; el.appendChild(sent);
    const nxt = [...Array(6).keys()].map(k => (i+1+k)%6).find(k => !game.r1[k].trim());
    r1Progress();
    setTimeout(() => { if(!game || game.step!==0 || game.scores[0]!==null) return; if(nxt!==undefined) showStory(nxt); else $("#abBtn").focus(); }, REDUCED?0:550);
  });

function floaties(el, set){
  if(REDUCED) return;
  for(let k=0;k<5;k++){ const f = document.createElement("span"); f.className = "floaty"; f.textContent = set[k%set.length];
    f.style.left = (15 + Math.random()*70) + "%"; f.style.animationDelay = (k*90) + "ms"; el.appendChild(f); setTimeout(() => f.remove(), 1700); }
}
const norm = s => s.toLowerCase().replace(/[’`´]/g,"'").replace(/'/g,"").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim().replace(/^(to |dont |do not |its |it is |thats |that is )/,"");
function lev(a,b){ const d=Array.from({length:a.length+1},(_,i)=>[i]); for(let j=1;j<=b.length;j++) d[0][j]=j; for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[a.length][b.length]; }
function checkR1(){ return game.r1.map((v,i) => { const n = norm(v), exact = SOL.m1[i].ok.includes(n); return { ok: exact || (n.length>8 && SOL.m1[i].ok.some(o=>lev(o,n)<=1)), exact, v }; }); }
async function revealR1(st, res, onPoint){
  st.innerHTML = `<div class="r1res">${R1.map((s,i)=>{ const r = res[i];
    return `<div class="r1card reveal ${r.ok?"ok":"no"}"><div class="who"><img class="av-img" src="${avURL(s.by[1],48)}" alt="">${esc(s.by[0])}</div><div class="e">${s.e}</div>
      <div>${r.ok && r.exact ? `<span class="okword">${esc(r.v)}</span>` : `<span class="${r.ok?"okword":"yours"}">${esc(r.v||"(blank)")}</span><br><span class="fix">${esc(SOL.m1[i].a)}</span>`}</div>
      <div class="verdict ${r.ok?"ok":"no"}">${r.ok ? (r.exact?"Correct":"Correct · small typo") : "Incorrect"}</div></div>`; }).join("")}</div>`;
  await revealSeq($$(".r1card"), res, onPoint);
}
async function revealSeq(els, res, onPoint){
  for(let i=0;i<els.length;i++){ await sleep(230); els[i].classList.add("on");
    if(res[i].ok){ onPoint(); if(!REDUCED){ const p = document.createElement("span"); p.className = "plus"; p.textContent = "+1"; els[i].appendChild(p); } } }
  await sleep(250);
}

/* ---------- Round 2: The Group Chat ---------- */
const avStack = () => Object.values(PEOPLE).map(p=>`<img class="av-img" src="${avURL(p[1],64)}" alt="">`).join("");
function mountR2(st){
  st.innerHTML = `<div class="handset"><div class="screen">
    <div class="ctop"><span class="back" aria-hidden="true">‹</span><div class="gavs">${avStack()}</div>
      <div class="ctitle"><b>Presentation group</b><small id="cstatus">Alex, Sam, Mo, You</small></div></div>
    <div class="cbody" id="cbody"><div class="daychip">Monday</div></div>
    <div class="sugs2" id="sugs2"><div class="label">Suggestions · 7 fit, 2 don’t</div><div class="chips">${BANK.map((w,i)=>`<button class="chip" data-chip="${i}" style="--c:${CHIPC[i]}">${esc(w)}</button>`).join("")}</div></div>
    <div class="cinput"><div class="fake">Message</div><div class="mic" aria-hidden="true">🎤</div></div>
  </div></div>`;
  game.r2wait = null; game.r2done = false;
  playChat(game.token);
}
const cbodyScroll = () => { const b = $("#cbody"); if(b) b.scrollTo({ top:b.scrollHeight, behavior: REDUCED?"auto":"smooth" }); };
async function playChat(token){
  const live = () => game && game.token===token;
  const box = $("#cbody"), status = $("#cstatus");
  progress(0, 7, "The chat is starting…");
  for(const item of CHAT){
    if(!live()) return;
    if(item[0]==="day"){ const d = document.createElement("div"); d.className = "daychip"; d.textContent = item[1]; box.appendChild(d); cbodyScroll(); await sleep(450); continue; }
    const [who, parts, time] = item, me = who==="Jules";
    const textLen = parts.filter(p=>typeof p!=="number").join("").length;
    if(!REDUCED){
      status.textContent = me ? "You are typing…" : `${who} is typing…`; status.classList.add("typing-on");
      const t = document.createElement("div"); t.className = "msgrow" + (me?" me":""); t.innerHTML = `<img class="av-img" src="${avURL(PEOPLE[who][1],56)}" alt=""><div class="typing"><i></i><i></i><i></i></div>`;
      box.appendChild(t); cbodyScroll();
      await sleep(Math.min(1500, Math.max(650, textLen*24)));
      t.remove();
    }
    if(!live()) return;
    status.textContent = "Alex, Sam, Mo, You"; status.classList.remove("typing-on");
    const row = document.createElement("div"); row.className = "msgrow" + (me?" me":"");
    row.innerHTML = `<img class="av-img" src="${avURL(PEOPLE[who][1],56)}" alt=""><div class="msg" style="--c:${PEOPLE[who][0]}">${me?"":`<div class="who">${who}</div>`}
      <div class="txt">${parts.map(p => typeof p==="number" ? gapHTML(p) : esc(p)).join("")}</div><div class="time">${time}${me?'<span class="ticks">✓✓</span>':""}</div></div>`;
    box.appendChild(row); cbodyScroll();
    const gaps = parts.filter(p=>typeof p==="number");
    if(gaps.length){
      const open = gaps.filter(g => game.r2[g]===null);
      if(open.length){
        game.r2a = open[0]; updateGaps();
        const note = document.createElement("div"); note.className = "waitnote"; note.textContent = gaps.length>1 ? "Fill both gaps to continue" : "Fill the gap to continue";
        box.appendChild(note); cbodyScroll(); $("#sugs2").classList.add("wait");
        progress(game.r2.filter(v=>v!==null).length, 7, `Chat paused · fill gap ${open.map(g=>g+1).join(" & ")}`);
        await new Promise(res => { game.r2wait = { gaps, res }; });
        if(!live()) return;
        note.remove(); $("#sugs2").classList.remove("wait");
      } else updateGaps();
      await sleep(350);
    } else await sleep(380);
  }
  game.r2done = true; game.r2wait = null; updateGaps();
}
function gapHTML(g){ return `<button class="gap" data-gap="${g}" aria-label="Gap ${g+1}"><span class="gn">${g+1}</span><span class="gt">&nbsp;</span></button>`; }
function updateGaps(){
  if(!game) return;
  const used = new Set(game.r2.filter(v=>v!==null));
  $$(".chip").forEach(c => c.classList.toggle("used", used.has(+c.dataset.chip)));
  $$(".gap").forEach(el => { const g = +el.dataset.gap, b = game.r2[g];
    el.classList.toggle("filled", b!==null); el.classList.toggle("active", b===null && game.r2a===g);
    el.style.setProperty("--c", b!==null ? CHIPC[b] : ""); el.querySelector(".gt").innerHTML = b!==null ? esc(BANK[b]) : "&nbsp;"; });
  const n = game.r2.filter(v=>v!==null).length;
  if(game.r2wait && game.r2wait.gaps.every(g => game.r2[g]!==null)){ const w = game.r2wait; game.r2wait = null; w.res(); }
  if(game.r2done) progress(n, 7, n<7 ? `${n}/7 gaps filled` : "All gaps filled");
  else if(!game.r2wait){ progress(n, 7, `${n}/7 gaps filled · the chat is still going`); $("#abBtn").disabled = true; }
}
const visibleGaps = () => $$(".gap").map(el => +el.dataset.gap);
function fillGap(g, b, fromEl){
  const prev = game.r2.indexOf(b); if(prev>=0) game.r2[prev] = null;
  const target = $(`.gap[data-gap="${g}"]`);
  const done = () => {
    game.r2[g] = b;
    const vis = visibleGaps(); const nxt = vis.find(k => game.r2[k]===null && k>g) ?? vis.find(k => game.r2[k]===null);
    game.r2a = nxt ?? null; updateGaps();
    if(target){ target.classList.remove("bump"); void target.offsetWidth; target.classList.add("bump"); }
  };
  if(REDUCED || !fromEl || !target) return done();
  const a = fromEl.getBoundingClientRect(), t = target.getBoundingClientRect();
  const fly = fromEl.cloneNode(true); fly.className = "chip flyer"; Object.assign(fly.style, { left:a.left+"px", top:a.top+"px", width:a.width+"px", margin:0 }); fly.style.setProperty("--c", CHIPC[b]);
  document.body.appendChild(fly);
  requestAnimationFrame(() => { fly.style.transform = `translate(${t.left + t.width/2 - a.left - a.width/2}px, ${t.top + t.height/2 - a.top - a.height/2}px) scale(.85)`; fly.style.opacity = ".2"; });
  setTimeout(() => { fly.remove(); done(); }, 420);
}
function wireChips(){
  const st = $("#stage");
  st.addEventListener("click", e => {
    if(!game || game.step!==1 || game.scores[1]!==null) return;
    const gap = e.target.closest("[data-gap]");
    if(gap){ const g = +gap.dataset.gap; if(game.r2[g]!==null) game.r2[g] = null; game.r2a = g; updateGaps(); }
  });
  let drag = null;
  st.addEventListener("pointerdown", e => {
    const chip = e.target.closest("[data-chip]"); if(!chip || !game || game.step!==1 || game.scores[1]!==null) return;
    drag = { chip, b:+chip.dataset.chip, x:e.clientX, y:e.clientY, ghost:null, over:null }; chip.setPointerCapture(e.pointerId);
  });
  st.addEventListener("pointermove", e => {
    if(!drag) return;
    if(!drag.ghost && Math.hypot(e.clientX-drag.x, e.clientY-drag.y) > 6){ drag.ghost = drag.chip.cloneNode(true); drag.ghost.classList.add("dragghost"); drag.ghost.classList.remove("used"); document.body.appendChild(drag.ghost); }
    if(drag.ghost){ drag.ghost.style.left = e.clientX+"px"; drag.ghost.style.top = e.clientY+"px";
      const over = document.elementFromPoint(e.clientX, e.clientY)?.closest?.(".gap");
      if(drag.over && drag.over!==over) drag.over.classList.remove("hot"); if(over) over.classList.add("hot"); drag.over = over; }
  });
  st.addEventListener("pointerup", () => {
    if(!drag) return; const d = drag; drag = null;
    if(d.over) d.over.classList.remove("hot");
    if(d.ghost){ d.ghost.remove(); if(d.over) fillGap(+d.over.dataset.gap, d.b, null); return; }
    const vis = visibleGaps();
    let g = game.r2a; if(g===null || g===undefined || !vis.includes(g) || game.r2[g]!==null) g = vis.find(k => game.r2[k]===null);
    if(g!==undefined) fillGap(g, d.b, d.chip);
  });
  st.addEventListener("pointercancel", () => { if(drag){ drag.ghost?.remove(); drag.over?.classList.remove("hot"); drag = null; } });
}
wireChips();
function checkR2(){ return game.r2.map((b,g) => ({ ok: b===SOL.m2[g], b })); }
async function revealR2(st, res, onPoint){
  st.innerHTML = `<div class="handset"><div class="screen">
    <div class="ctop"><span class="back" aria-hidden="true">‹</span><div class="gavs">${avStack()}</div><div class="ctitle"><b>Presentation group</b><small>Corrections</small></div></div>
    <div class="cbody static"><div class="daychip">Monday</div>${CHAT.map(item => { if(item[0]==="day") return `<div class="daychip">${item[1]}</div>`;
      const [who,parts,time] = item, me = who==="Jules";
      return `<div class="msgrow ${me?"me":""}" style="animation:none"><img class="av-img" src="${avURL(PEOPLE[who][1],56)}" alt=""><div class="msg" style="--c:${PEOPLE[who][0]}">${me?"":`<div class="who">${who}</div>`}
      <div class="txt">${parts.map(p => { if(typeof p!=="number") return esc(p); const r = res[p];
        return `<span class="gapmark reveal ${r.ok?"ok":""}" data-g="${p}">${r.ok ? `<span class="okword">${esc(BANK[r.b])}</span>` : `<span class="yours">${r.b===null?"(blank)":esc(BANK[r.b])}</span><span class="fix">${esc(BANK[SOL.m2[p]])}</span>`}</span>`; }).join("")}</div>
      <div class="time">${time}${me?'<span class="ticks">✓✓</span>':""}</div></div></div>`; }).join("")}</div></div></div>`;
  const marks = [...Array(7).keys()].map(g => st.querySelector(`[data-g="${g}"]`));
  for(let i=0;i<7;i++){ await sleep(260); marks[i].classList.add("on"); if(res[i].ok) onPoint(); }
  await sleep(250);

/* ---------- Round 3: Finish the Search ---------- */
function mountR3(st){
  st.innerHTML = `<div class="engine">
    <div class="elogo" aria-label="Idiom search"><span>i</span><span>d</span><span>i</span><span>o</span><span>m</span><span>s</span><em>search</em></div>
    <div class="sdots" id="sdots">${R3.map((_,i)=>`<span class="sdot" data-dot="${i}">${i+1}</span>`).join("")}</div>
    <div id="sarea"><div class="startcard"><div style="font-size:38px">⏱️</div><b style="font-family:var(--f-display);font-size:20px">8 searches · ${R3_SECONDS} seconds each</b>
      <span class="muted">Only one suggestion is the real idiom. If the time runs out, the search counts as wrong.</span>
      <button class="btn" id="r3go">Start searching</button></div></div>
    <div class="stip" id="stip"></div></div>`;
  $("#r3go").onclick = () => nextSearch(game.token);
  r3Progress();
}
function r3Progress(){
  const n = game.r3.filter(v=>v!==null).length; progress(n, 8, `${n}/8 searches done`);
  $$(".sdot").forEach((d,i)=>{ const v = game.r3[i]; d.classList.toggle("done", v!==null && v>=0); d.classList.toggle("late", v===-1); d.classList.toggle("cur", i===game.r3i && v===null); d.textContent = v===-1 ? "⌛" : i+1; });
}
function nextSearch(token){
  const i = game.r3.findIndex(v => v===null);
  if(i<0){ $("#sarea").innerHTML = `<div class="startcard"><div style="font-size:38px">✅</div><b style="font-family:var(--f-display);font-size:20px">All searches done</b><span class="muted">Check your answers below.</span></div>`; $("#stip").textContent = ""; r3Progress(); $("#abBtn").focus(); return; }
  game.r3i = i; r3Progress();
  const item = R3[i];
  $("#sarea").innerHTML = `<div class="sbox" id="sbox"><div class="sbar"><span class="mag">🔍</span><span class="q"><span id="typed"></span><span class="caret"></span></span>
      <span class="clock" id="clock"><svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="#ece9f8" stroke-width="4"/><circle id="clockArc" cx="20" cy="20" r="17" fill="none" stroke="#6d3df5" stroke-width="4" stroke-linecap="round" stroke-dasharray="106.8" stroke-dashoffset="0"/></svg><span id="clockNum">${R3_SECONDS}</span></span></div>
    <div class="sugs" id="sugs">${item.o.map((o,k)=>`<button class="sug" data-k="${k}"><span class="mg">🔍</span><span>${esc(item.q)} <b>${esc(o)}</b></span></button>`).join("")}</div></div>`;
  $("#stip").textContent = `Search ${i+1} of 8`;
  const typed = $("#typed"); let c = 0; let started = 0, raf = 0, over = false;
  const live = () => game && game.token===token && game.step===2 && game.scores[2]===null;
  const startClock = () => {
    started = performance.now();
    const loop = now => {
      if(!live() || over) return;
      const left = Math.max(0, R3_SECONDS*1000 - (now - started));
      $("#clockArc").setAttribute("stroke-dashoffset", (106.8 * (1 - left/(R3_SECONDS*1000))).toFixed(1));
      $("#clockNum").textContent = Math.ceil(left/1000);
      $("#clock").classList.toggle("hurry", left < 4000);
      if(left < 4000) $("#clockArc").setAttribute("stroke", "#e5254a");
      if(left <= 0){ finishItem(-1); return; }
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
  };
  const showSugs = () => { $$(".sug").forEach((s,j)=>setTimeout(()=>s.classList.add("in"), REDUCED?0:j*80)); startClock(); };
  const typeStep = () => { if(!live()) return; typed.textContent = item.q.slice(0, ++c); if(c < item.q.length) setTimeout(typeStep, REDUCED?0:30); else showSugs(); };
  typeStep();
  const finishItem = k => {
    if(over) return; over = true; cancelAnimationFrame(raf);
    game.r3[i] = k; $$(".sug").forEach(s => s.disabled = true);
    if(k===-1){ const t = document.createElement("div"); t.className = "timeup"; t.textContent = "Time’s up"; $("#sbox").appendChild(t); }
    else { $(`.sug[data-k="${k}"]`).classList.add("chosen"); typed.innerHTML = `${esc(item.q)} <span style="color:#6d3df5">${esc(item.o[k])}</span>`; }
    r3Progress();
    setTimeout(() => { if(live()) nextSearch(token); }, REDUCED?0:(k===-1?900:520));
  };
  $("#sugs").onclick = e => { const b = e.target.closest("[data-k]"); if(b && live() && $$(".sug.in").length) finishItem(+b.dataset.k); };
}
function checkR3(){ return game.r3.map((k,i) => ({ ok: k===SOL.m3[i], k })); }
async function revealR3(st, res, onPoint){
  st.innerHTML = `<div class="r3res">${R3.map((it,i)=>{ const r = res[i], right = `${it.q} ${it.o[SOL.m3[i]]}`;
    const yours = r.k===-1 ? "Time’s up" : r.k===null ? "(blank)" : `${it.q} ${it.o[r.k]}`;
    return `<div class="r3row reveal ${r.ok?"ok":"no"}"><span class="st">🔍</span>
      ${r.ok ? `<span class="okword">${esc(right)}</span>` : `<span class="yours">${esc(yours)}</span><span class="fix">${esc(right)}</span>`}
      <span class="verdict ${r.ok?"ok":"no"}" style="margin-left:auto">${r.ok?"Correct":"Incorrect"}</span></div>`; }).join("")}</div>`;
  await revealSeq($$(".r3row"), res, onPoint);
}

/* ================= FINISH + LEADERBOARD ================= */
async function finish(){
  game.tEnd = Date.now(); clearInterval(timerId); tick();
  const ms = game.tEnd - game.t0, sc = total();
  $("#resultBox").innerHTML = `<div class="label">Your result</div><div class="big"><span id="countUp">0</span><small>/21</small></div><div class="rank" id="rankLine">&nbsp;</div>
    <div class="statrow">${ROUNDS.map((r,i)=>`<div class="stat"><b>${game.scores[i]}/${r.pts}</b><span>${r.icon} ${r.title}</span></div>`).join("")}<div class="stat"><b>${fmt(ms)}</b><span>⏱ Time</span></div></div>`;
  $("#resultBox").classList.remove("hidden"); show("sBoard"); hud(false);
  for(let i=1;i<=sc;i++){ await sleep(45); $("#countUp").textContent = i; }
  if(sc >= 16) boom(true);
  game.myId = await saveScore({ name:player.name, avatar:player.avatar, score:sc, time_ms:ms });
  loadBoard(game.myId);
}
let lastError = "";
async function saveScore(row){
  if(ONLINE){ try{
      const r = await fetch(`${API}/rest/v1/${TABLE}`, { method:"POST", headers:{ ...authHeaders(), "Content-Type":"application/json", Prefer:"return=representation" }, body: JSON.stringify(row) });
      if(!r.ok) throw new Error(await r.text()); const [saved] = await r.json(); return "db-"+saved.id;
    }catch(err){ console.error(err); lastError = "Your score couldn’t be saved online."; } }
  const all = store.get("ie-scores", []); const id = "local-"+Date.now(); all.push({ ...row, id, created_at:new Date().toISOString() }); store.set("ie-scores", all); return id;
}
async function fetchScores(){
  if(ONLINE){ try{
      const r = await fetch(`${API}/rest/v1/${TABLE}?select=id,name,avatar,score,time_ms&order=score.desc,time_ms.asc&limit=500`, { headers:authHeaders() });
      if(!r.ok) throw new Error(await r.text()); return (await r.json()).map(x=>({ ...x, id:"db-"+x.id }));
    }catch(err){ console.error(err); lastError = "The leaderboard couldn’t be loaded."; return []; } }
  return store.get("ie-scores", []);
}
async function loadBoard(myId){
  lastError = "";
  const rows = await fetchScores(); rows.sort((a,b)=> b.score-a.score || a.time_ms-b.time_ms);
  const best = new Map(); for(const r of rows){ const k = r.name.trim().toLowerCase(); if(!best.has(k)) best.set(k, r); }
  const ranked = [...best.values()];
  const mine = myId && rows.find(r=>r.id===myId); const meKey = mine ? mine.name.trim().toLowerCase() : null;
  const isMe = r => meKey && r.name.trim().toLowerCase()===meKey;
  $("#podium").innerHTML = [1,0,2].map(i => { const r = ranked[i], cls = ["p1","p2","p3"][i];
    if(!r) return `<div class="pod ${cls} empty"><div class="avw"><span class="emo">?</span></div><div class="nm muted">Open</div><div class="block">${i+1}</div></div>`;
    return `<div class="pod ${cls} ${isMe(r)?"me":""}"><div class="avw">${i===0?'<span class="crown">👑</span>':""}${avHTML(r.avatar,"av-img",160)}</div>
      <div class="nm" title="${esc(r.name)}">${esc(r.name)}</div><div class="sc">${r.score}/21</div><div class="tm">⏱ ${fmt(r.time_ms)}</div><div class="block">${i+1}</div></div>`; }).join("");
  $("#list").innerHTML = ranked.slice(3,50).map((r,k)=>`<div class="lrow ${isMe(r)?"me":""}" style="animation-delay:${k*40}ms"><span class="rk">${k+4}</span>${avHTML(r.avatar,"av-img",72)}
    <span class="nm">${esc(r.name)}</span><span class="sc">${r.score}</span><span class="tm">${fmt(r.time_ms)}</span></div>`).join("");
  if(meKey && $("#rankLine")){ const pos = ranked.findIndex(isMe); if(pos>=0) $("#rankLine").textContent = ranked[pos].id===mine.id ? `You’re #${pos+1} of ${ranked.length}` : `Your best run is still #${pos+1} of ${ranked.length}`; }
  $("#modeNote").textContent = lastError || (ONLINE ? "Best run per name counts." : "Local mode: scores are saved in this browser only.");
  $("#modeNote").className = "note" + (lastError || !ONLINE ? " warn" : "");
}
