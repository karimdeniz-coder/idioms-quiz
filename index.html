<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idiom Emergency</title>
<meta name="description" content="An English idioms quiz in three rounds, with a live leaderboard.">
<meta name="theme-color" content="#140f33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Night arcade: deep indigo, slow colour blobs, glass cards. Each round owns one gradient. */
:root{
  --bg:#140f33; --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12); --line:rgba(255,255,255,.14);
  --ink:#f4f2ff; --muted:#b4aedb; --dim:#7f79a8;
  --yellow:#ffd23f; --pink:#ff4fa3; --orange:#ff8a3d; --violet:#8b5cff; --cyan:#22d3ee; --green:#2ee59d; --red:#ff5c7a; --blue:#4f8cff;
  --g1:linear-gradient(135deg,#ff4fa3,#ff8a3d);
  --g2:linear-gradient(135deg,#2ee59d,#22b8cf);
  --g3:linear-gradient(135deg,#4f8cff,#8b5cff);
  --gold:linear-gradient(180deg,#ffe58a,#ffc21a); --silver:linear-gradient(180deg,#f2f4fb,#bfc6dc); --bronze:linear-gradient(180deg,#f7c39b,#d98a52);
  --f-display:"Unbounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1.2);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;overflow-x:hidden;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(110px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(80px);opacity:.38;animation:float 22s ease-in-out infinite alternate}
.blobs i:nth-child(1){background:#ff4fa3;left:-12vmax;top:-14vmax}
.blobs i:nth-child(2){background:#4f8cff;right:-14vmax;top:10vmax;animation-delay:-7s}
.blobs i:nth-child(3){background:#2ee59d;left:20vmax;bottom:-20vmax;opacity:.22;animation-delay:-13s}
@keyframes float{to{transform:translate(6vmax,4vmax) scale(1.12)}}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.hidden{display:none!important}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,4vw,30px);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn{border:0;border-radius:14px;padding:13px 22px;font-weight:700;font-size:16px;background:var(--yellow);color:#231a00;box-shadow:0 4px 0 #b88f00;transition:transform .12s var(--ease),box-shadow .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b88f00}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 4px 0 #b88f00}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:8px 14px;font-size:14px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.av-img{display:block;border-radius:50%;background:var(--glass2)}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo .dot{width:12px;height:12px;border-radius:50%;background:var(--g1);box-shadow:0 0 14px #ff4fa3}
.logo span{background:linear-gradient(90deg,#ffd23f,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
.spacer{flex:1}
.chipstat{display:inline-flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chipstat .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--glass2)}
.chipstat.player{padding-left:4px}
#scoreVal.pop{animation:pop .45s var(--ease)}
@keyframes pop{40%{transform:scale(1.5)}}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.step{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.step .n{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-size:12px;background:var(--glass2);color:var(--ink)}
.step span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.now{color:var(--ink);border-color:transparent;background:var(--sg)}
.step.now .n{background:rgba(0,0,0,.25)}
.step.done{color:var(--ink)}
.step.done .n{background:var(--green);color:#06301f}
@media(max-width:520px){.step span:last-child{display:none}.step{justify-content:center}}
.exitbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(255,92,122,.12);border:1px solid rgba(255,92,122,.4);border-radius:14px;padding:10px 14px;font-size:15px}

/* ---------- Welcome ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.hero h1{font-size:clamp(34px,8vw,64px)}
.hero h1 b{display:block;background:linear-gradient(90deg,#ffd23f,#ff8a3d 45%,#ff4fa3);-webkit-background-clip:text;background-clip:text;color:transparent}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fact{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;background:var(--glass2)}
.preview{display:grid;justify-items:center;gap:8px;text-align:center}
.preview .ring{padding:5px;border-radius:50%;background:conic-gradient(from 0deg,#ffd23f,#ff4fa3,#8b5cff,#22d3ee,#2ee59d,#ffd23f);animation:spin 6s linear infinite}
.preview .ring > *{animation:spin 6s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.preview .ring img{width:112px;height:112px;border:4px solid var(--bg)}
.preview .nm{font-family:var(--f-display);font-weight:800;font-size:16px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:600px){.hero{grid-template-columns:1fr}.preview{order:-1}}
.form{display:grid;gap:16px;margin-top:22px}
.name-in{width:100%;font:inherit;font-size:20px;font-weight:700;color:var(--ink);background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:14px;padding:13px 16px}
.name-in:focus{border-color:var(--yellow);outline:none}
.av-tabs{display:flex;gap:6px;flex-wrap:wrap}
.av-tab{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.av-tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:10px}
.avatar{aspect-ratio:1;border-radius:18px;border:2px solid transparent;background:var(--glass);padding:4px;transition:transform .15s var(--ease)}
.avatar img{width:100%;height:100%;border-radius:14px;display:block}
.avatar:hover{transform:translateY(-3px) rotate(-3deg)}
.avatar[aria-pressed="true"]{border-color:var(--yellow);background:rgba(255,210,63,.18);transform:scale(1.05)}

/* ---------- Round frame ---------- */
.rhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.rbadge{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:26px;background:var(--rg);box-shadow:0 8px 24px -8px rgba(0,0,0,.6)}
.rhead h2{font-size:clamp(20px,4vw,28px)}
.rhead p{margin:4px 0 0;color:var(--muted);font-size:15px}
.rpts{font-family:var(--f-display);font-weight:800;font-size:26px;text-align:right;font-variant-numeric:tabular-nums}
.rpts small{color:var(--dim);font-weight:600}
.stage{margin-top:18px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(20,15,51,0),rgba(20,15,51,.92) 35%)}
.actionbar .in{max-width:900px;margin:0 auto;display:flex;gap:12px;align-items:center;background:rgba(30,24,70,.85);border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.actionbar .hint{flex:1;color:var(--muted);font-size:14px;min-width:0}
.meter{height:6px;border-radius:6px;background:var(--glass2);overflow:hidden;margin-top:6px;max-width:220px}
.meter b{display:block;height:100%;width:0;background:var(--rg);transition:width .35s var(--ease)}
.roundscore{font-family:var(--f-display);font-weight:800;font-size:22px}

/* Correction marks */
.yours{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2.5px;color:#ffb2c1}
.fix{color:var(--green);font-weight:700}
.fix::before{content:"→ ";color:var(--dim);font-weight:400}
.okword{color:var(--green);font-weight:700}
.verdict{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.verdict.ok{color:var(--green)} .verdict.no{color:var(--red)}
.reveal{opacity:0;transform:translateY(8px) scale(.98)}
.reveal.on{opacity:1;transform:none;transition:opacity .35s, transform .45s var(--ease)}
.plus{position:absolute;right:10px;top:8px;font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--green);animation:plus 1s ease-out forwards}
@keyframes plus{from{opacity:0;transform:translateY(6px)}30%{opacity:1}to{opacity:0;transform:translateY(-18px)}}

/* ---------- Round 1: stories ---------- */
.stories{display:grid;grid-template-columns:minmax(0,380px);justify-content:center;gap:14px}
.rings{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ringbtn{position:relative;width:54px;height:54px;border-radius:50%;padding:3px;border:0;background:var(--g1);transition:transform .2s var(--ease)}
.ringbtn span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:20px;border:2px solid var(--bg)}
.ringbtn.seen{background:var(--glass2)}
.ringbtn.seen::after{content:"✓";position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--green);color:#06301f;font-size:12px;font-weight:800;display:grid;place-items:center}
.ringbtn.cur{transform:scale(1.12)}
.story{position:relative;aspect-ratio:9/14;max-height:68vh;border-radius:26px;overflow:hidden;background:var(--sg);box-shadow:0 30px 60px -30px rgba(0,0,0,.8);display:flex;flex-direction:column;padding:12px;min-height:420px;width:100%}
.story .bars{display:flex;gap:4px}
.story .bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
.story .bars i b{display:block;height:100%;width:0;background:#fff}
.story .bars i.full b{width:100%}
.story .bars i.cur b{animation:fill 6s linear forwards}
@keyframes fill{to{width:100%}}
.shead{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.shead img{width:32px;height:32px;border:2px solid #fff}
.shead small{opacity:.75}
.scontent{flex:1;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center}
.semoji{font-size:clamp(52px,14vw,76px);line-height:1.15;letter-spacing:.04em;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.sq{font-family:var(--f-display);font-weight:800;font-size:18px;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.shint{background:rgba(0,0,0,.28);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:700}
.snav{position:absolute;top:70px;bottom:90px;width:30%;border:0;background:transparent}
.snav.prev{left:0}.snav.next{right:0}
.sreply{display:flex;gap:8px;align-items:center}
.sreply input{flex:1;min-width:0;font:inherit;font-size:16px;color:#fff;background:rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.75);border-radius:999px;padding:11px 16px}
.sreply input::placeholder{color:rgba(255,255,255,.8)}
.sreply input:focus{outline:none;background:rgba(0,0,0,.35)}
.sreply button{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#c2185b;font-size:18px;font-weight:800}
.slide-l{animation:slideL .35s var(--ease)} .slide-r{animation:slideR .35s var(--ease)}
@keyframes slideL{from{transform:translateX(30px) rotate(1.5deg);opacity:.2}}
@keyframes slideR{from{transform:translateX(-30px) rotate(-1.5deg);opacity:.2}}
.sent{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:#fff;color:#c2185b;font-weight:800;border-radius:999px;padding:6px 14px;font-size:14px;animation:sent .9s ease-out forwards;pointer-events:none}
@keyframes sent{from{opacity:0;transform:translate(-50%,10px)}25%{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-40px)}}
.r1res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:640px){.r1res{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:400px){.r1res{grid-template-columns:1fr}}
.r1card{position:relative;border-radius:18px;padding:12px;background:var(--glass);border:1px solid var(--line);display:grid;gap:6px;min-width:0}
.r1card .e{font-size:34px;text-align:center}
.r1card.ok{border-color:var(--green)} .r1card.no{border-color:var(--red)}

/* ---------- Round 2: chat ---------- */
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px;border-radius:18px;background:rgba(0,0,0,.18);border:1px dashed var(--line);margin-bottom:14px;transition:opacity .3s}
.bank .label{width:100%;text-align:center}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;border:0;border-radius:999px;padding:9px 15px;font-weight:700;font-size:15px;color:#fff;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .15s var(--ease),opacity .2s}
.chip:hover{transform:translateY(-2px)}
.chip.used{opacity:.28;transform:scale(.94)}
.dragghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg) scale(1.08);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.flyer{position:fixed;z-index:60;pointer-events:none;transition:transform .42s var(--ease),opacity .42s}
.phone{max-width:600px;margin:0 auto;border-radius:28px;overflow:hidden;background:#0b0a22;border:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
.ptop{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(135deg,rgba(46,229,157,.22),rgba(34,184,207,.22));border-bottom:1px solid var(--line)}
.ptop .gav{display:flex}
.ptop .gav img{width:30px;height:30px;border:2px solid #0b0a22;margin-left:-8px}
.ptop .gav img:first-child{margin-left:0}
.ptop b{font-family:var(--f-display);font-size:14px;display:block}
.ptop small{color:var(--muted);font-size:12px}
.msgs{display:flex;flex-direction:column;gap:8px;padding:14px;min-height:200px}
.msgrow{display:flex;gap:8px;align-items:flex-end;animation:msgin .35s var(--ease) both}
.msgrow.me{flex-direction:row-reverse}
.msgrow img{width:28px;height:28px;flex:none}
@keyframes msgin{from{opacity:0;transform:translateY(10px) scale(.96)}}
.msg{max-width:80%;padding:8px 12px 6px;border-radius:18px 18px 18px 6px;background:#1f1c47;min-width:0}
.msgrow.me .msg{background:linear-gradient(135deg,#1aa57a,#178fa5);border-radius:18px 18px 6px 18px}
.msg .who{font-size:12px;font-weight:700;color:var(--c)}
.msgrow.me .msg .who{color:#d9fff2}
.msg .txt{font-size:16px;line-height:1.8}
.msg .time{font-size:11px;color:rgba(255,255,255,.55);text-align:right}
.typing{display:inline-flex;gap:4px;padding:12px 14px;border-radius:18px;background:#1f1c47}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dots 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dots{50%{transform:translateY(-4px);opacity:.5}}
.gap{display:inline-flex;align-items:center;gap:6px;min-width:7.5em;justify-content:center;border:2px dashed rgba(255,255,255,.45);background:rgba(0,0,0,.15);border-radius:10px;padding:0 10px;font-weight:700;font-size:15px;line-height:1.7;vertical-align:baseline;transition:background .2s,border-color .2s,transform .2s var(--ease)}
.gap .gn{font-family:var(--f-display);font-size:10px;opacity:.7}
.gap.active{border-color:var(--yellow);background:rgba(255,210,63,.16);box-shadow:0 0 0 4px rgba(255,210,63,.15)}
.gap.hot{transform:scale(1.08);border-color:var(--yellow);background:rgba(255,210,63,.3)}
.gap.filled{border-style:solid;border-color:transparent;background:var(--c);color:#fff}
.gap.bump{animation:bump .4s var(--ease)}
@keyframes bump{40%{transform:scale(1.15)}}
.gapmark{display:inline-flex;flex-direction:column;vertical-align:middle;line-height:1.25;margin:0 2px;font-size:15px;padding:2px 8px;border-radius:8px;background:rgba(0,0,0,.2)}
.gapmark.ok{background:rgba(46,229,157,.18)}

/* ---------- Round 3: search ---------- */
.search{max-width:620px;margin:0 auto;display:grid;gap:14px}
.sdots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.sdot{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--glass);font-family:var(--f-display);font-size:12px;font-weight:800}
.sdot.done{background:var(--g3);border-color:transparent}
.sdot.cur{outline:2px solid var(--yellow);outline-offset:2px}
.sbox{border-radius:26px;background:#fff;color:#1b1840;box-shadow:0 20px 50px -20px rgba(0,0,0,.7);overflow:hidden}
.sbar{display:flex;align-items:center;gap:12px;padding:15px 20px;font-size:19px}
.sbar .mag{font-size:20px}
.sbar .q{flex:1;min-width:0;font-weight:700}
.sbar .q .pick{color:#6d3df5}
.caret{display:inline-block;width:2px;height:1.1em;background:#6d3df5;vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sugs{border-top:1px solid #e7e5f4;padding:6px 0}
.sug{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;color:#1b1840;padding:12px 20px;font-size:17px;opacity:0;transform:translateY(-6px);transition:background .15s}
.sug.in{opacity:1;transform:none;transition:opacity .25s, transform .3s var(--ease), background .15s}
.sug:hover,.sug:focus-visible{background:#f1eefe}
.sug .mg{color:#9a97b5}
.sug b{font-weight:800}
.sug.chosen{background:#ebe4ff}
.sug.chosen::after{content:"✓";margin-left:auto;color:#6d3df5;font-weight:800}
.stip{text-align:center;color:var(--muted);font-size:14px}
.r3res{display:grid;gap:8px;max-width:640px;margin:0 auto}
.r3row{position:relative;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.r3row.ok{border-color:var(--green)} .r3row.no{border-color:var(--red)}
.r3row .st{font-weight:700}

/* ---------- Results & leaderboard ---------- */
.result{display:grid;gap:10px;justify-items:center;text-align:center;padding-bottom:20px;border-bottom:1px solid var(--line)}
.result .big{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,16vw,112px);line-height:1;background:linear-gradient(90deg,#ffd23f,#ff8a3d,#ff4fa3);-webkit-background-clip:text;background-clip:text;color:transparent}
.result .big small{font-size:.35em;-webkit-text-fill-color:var(--dim)}
.rank{font-weight:700;font-size:18px}
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
@media(max-width:540px){.statrow{grid-template-columns:repeat(2,minmax(0,1fr))}}

.pod.me .nm{background:var(--yellow);color:#231a00}

function mountR1(st){
  st.innerHTML = `<div class="stories">
    <div class="rings" id="rings">${R1.map((s,i)=>`<button class="ringbtn" data-ring="${i}" aria-label="Story ${i+1}"><span>${s.e.split(" ")[0]}</span></button>`).join("")}</div>
    <div class="story" id="story"></div>
  </div>`;
  $("#rings").addEventListener("click", e => { const b = e.target.closest("[data-ring]"); if(b) showStory(+b.dataset.ring); });
  showStory(game.r1i, true);
}
function r1Progress(){ const n = game.r1.filter(v=>v.trim()).length; progress(n, 6, `${n}/6 stories answered`);
  $$(".ringbtn").forEach((b,i)=>{ b.classList.toggle("seen", !!game.r1[i].trim()); b.classList.toggle("cur", i===game.r1i); }); }
function showStory(i, first){
  const dir = i >= game.r1i ? "slide-l" : "slide-r"; game.r1i = i;
  const s = R1[i], el = $("#story");
  el.style.setProperty("--sg", s.g);
  el.innerHTML = `<div class="bars">${R1.map((_,j)=>`<i class="${j<i||game.r1[j].trim()?"full":""} ${j===i?"cur":""}"><b></b></i>`).join("")}</div>
    <div class="shead"><img class="av-img" src="${avURL("bo:idiomemergency",64)}" alt=""><b>idiom.emergency</b><small>· ${i+1}/6</small></div>
    <button class="snav prev" aria-label="Previous story" ${i===0?"hidden":""}></button><button class="snav next" aria-label="Next story" ${i===5?"hidden":""}></button>
    <div class="scontent"><div class="sq">Guess the idiom</div><div class="semoji" aria-hidden="true">${s.e}</div><div class="shint">${esc(s.h)}</div></div>
    <form class="sreply" id="sreply"><input id="r1in" value="${esc(game.r1[i])}" placeholder="Reply with the idiom…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Answer for story ${i+1}"><button aria-label="Send">➤</button></form>`;
  if(!first){ el.classList.remove("slide-l","slide-r"); void el.offsetWidth; el.classList.add(dir); }
  el.querySelector(".prev").onclick = () => showStory(Math.max(0,i-1));
  el.querySelector(".next").onclick = () => showStory(Math.min(5,i+1));
  const inp = $("#r1in");
  inp.addEventListener("input", () => { game.r1[i] = inp.value; r1Progress(); });
  $("#sreply").addEventListener("submit", e => {
    e.preventDefault(); if(!inp.value.trim()) return;
    game.r1[i] = inp.value; const sent = document.createElement("div"); sent.className = "sent"; sent.textContent = "Sent ✓"; el.appendChild(sent);
    const nxt = [...Array(6).keys()].map(k => (i+1+k)%6).find(k => !game.r1[k].trim());
    setTimeout(() => { if(nxt!==undefined) showStory(nxt); else { r1Progress(); $("#abBtn").focus(); } }, REDUCED?0:420);
    r1Progress();
  });
  if(!first || window.innerWidth > 700) setTimeout(() => inp.focus({preventScroll:true}), 50);
  r1Progress();
}
const norm = s => s.toLowerCase().replace(/[’`´]/g,"'").replace(/'/g,"").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim().replace(/^(to |dont |do not |its |it is |thats |that is )/,"");
function lev(a,b){ const d=Array.from({length:a.length+1},(_,i)=>[i]); for(let j=1;j<=b.length;j++) d[0][j]=j; for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[a.length][b.length]; }
function checkR1(){ return game.r1.map((v,i) => { const n = norm(v), exact = SOL.m1[i].ok.includes(n); return { ok: exact || (n.length>8 && SOL.m1[i].ok.some(o=>lev(o,n)<=1)), exact, v }; }); }
async function revealR1(st, res, onPoint){
  st.innerHTML = `<div class="r1res">${R1.map((s,i)=>{ const r = res[i];
    return `<div class="r1card reveal ${r.ok?"ok":"no"}"><div class="e">${s.e}</div>
      <div>${r.ok && r.exact ? `<span class="okword">${esc(r.v)}</span>` : `<span class="${r.ok?"okword":"yours"}">${esc(r.v||"(blank)")}</span><br><span class="fix">${esc(SOL.m1[i].a)}</span>`}</div>
      <div class="verdict ${r.ok?"ok":"no"}">${r.ok ? (r.exact?"Correct":"Correct · small typo") : "Incorrect"}</div></div>`; }).join("")}</div>`;
  await revealSeq($$(".r1card"), res, onPoint);
}
async function revealSeq(els, res, onPoint){
  for(let i=0;i<els.length;i++){ await sleep(230); els[i].classList.add("on");
    if(res[i].ok){ onPoint(); if(!REDUCED){ const p = document.createElement("span"); p.className = "plus"; p.textContent = "+1"; els[i].appendChild(p); } } }
  await sleep(250);
}

/* ---------- Round 2: Group Chat ---------- */
function mountR2(st){
  st.innerHTML = `<div class="bank" id="bank"><div class="label">Word bank · drag or tap</div>${BANK.map((w,i)=>`<button class="chip" data-chip="${i}" style="--c:${CHIPC[i]}">${esc(w)}</button>`).join("")}</div>
    <div class="phone"><div class="ptop"><div class="gav">${Object.values(PEOPLE).map(p=>`<img class="av-img" src="${avURL(p[1],60)}" alt="">`).join("")}</div>
      <div><b>Presentation group</b><small>Alex, Sam, Mo, Jules (you)</small></div></div><div class="msgs" id="msgs"></div></div>`;
  playChat($("#msgs"));
}
async function playChat(box){
  for(const [who, parts, time] of CHAT){
    if(!game || game.step!==1) return;
    const me = who==="Jules";
    if(!REDUCED){ const t = document.createElement("div"); t.className = "msgrow" + (me?" me":""); t.innerHTML = `<img class="av-img" src="${avURL(PEOPLE[who][1],56)}" alt=""><div class="typing"><i></i><i></i><i></i></div>`; box.appendChild(t); await sleep(260); t.remove(); }
    const row = document.createElement("div"); row.className = "msgrow" + (me?" me":"");
    row.innerHTML = `<img class="av-img" src="${avURL(PEOPLE[who][1],56)}" alt=""><div class="msg" style="--c:${PEOPLE[who][0]}"><div class="who">${who}${me?" (you)":""}</div>
      <div class="txt">${parts.map(p => typeof p==="number" ? gapHTML(p) : esc(p)).join("")}</div><div class="time">${time}</div></div>`;
    box.appendChild(row); updateGaps();
  }
}
function gapHTML(g){ return `<button class="gap" data-gap="${g}" aria-label="Gap ${g+1}"><span class="gn">${g+1}</span><span class="gt">&nbsp;</span></button>`; }
function updateGaps(){
  const used = new Set(game.r2.filter(v=>v!==null));
  $$(".chip").forEach(c => c.classList.toggle("used", used.has(+c.dataset.chip)));
  $$(".gap").forEach(el => { const g = +el.dataset.gap, b = game.r2[g];
    el.classList.toggle("filled", b!==null); el.classList.toggle("active", b===null && game.r2a===g);
    el.style.setProperty("--c", b!==null ? CHIPC[b] : ""); el.querySelector(".gt").innerHTML = b!==null ? esc(BANK[b]) : "&nbsp;"; });
  const n = game.r2.filter(v=>v!==null).length; progress(n, 7, `${n}/7 gaps filled`);
}
function fillGap(g, b, fromEl){
  const prev = game.r2.indexOf(b); if(prev>=0) game.r2[prev] = null;
  const target = $(`.gap[data-gap="${g}"]`);
  const finish = () => { game.r2[g] = b; const nxt = game.r2.findIndex((v,i)=>v===null && i>g); game.r2a = nxt>=0 ? nxt : game.r2.indexOf(null); updateGaps();
    if(target){ target.classList.remove("bump"); void target.offsetWidth; target.classList.add("bump"); } };
  if(REDUCED || !fromEl || !target) return finish();
  const a = fromEl.getBoundingClientRect(), t = target.getBoundingClientRect();
  const fly = fromEl.cloneNode(true); fly.className = "chip flyer"; fly.style.left = a.left+"px"; fly.style.top = a.top+"px"; fly.style.width = a.width+"px"; fly.style.margin = 0; document.body.appendChild(fly);
  requestAnimationFrame(() => { fly.style.transform = `translate(${t.left + t.width/2 - a.left - a.width/2}px, ${t.top + t.height/2 - a.top - a.height/2}px) scale(.85)`; fly.style.opacity = ".2"; });
  setTimeout(() => { fly.remove(); finish(); }, 420);
}
function wireChips(){
  const st = $("#stage");
  st.addEventListener("click", e => {
    if(!game || game.step!==1 || game.scores[1]!==null) return;
    const gap = e.target.closest("[data-gap]");
    if(gap){ const g = +gap.dataset.gap; if(game.r2[g]!==null) game.r2[g] = null; game.r2a = g; updateGaps(); }
  });
  let drag = null;
  st.addEventListener("pointerdown", e => {
    const chip = e.target.closest("[data-chip]"); if(!chip || !game || game.step!==1 || game.scores[1]!==null) return;
    drag = { chip, b:+chip.dataset.chip, x:e.clientX, y:e.clientY, ghost:null, over:null }; chip.setPointerCapture(e.pointerId);
  });
  st.addEventListener("pointermove", e => {
    if(!drag) return;
    if(!drag.ghost && Math.hypot(e.clientX-drag.x, e.clientY-drag.y) > 6){ drag.ghost = drag.chip.cloneNode(true); drag.ghost.classList.add("dragghost"); drag.ghost.classList.remove("used"); document.body.appendChild(drag.ghost); }
    if(drag.ghost){ drag.ghost.style.left = e.clientX+"px"; drag.ghost.style.top = e.clientY+"px";
      const over = document.elementFromPoint(e.clientX, e.clientY)?.closest?.(".gap");
      if(drag.over && drag.over!==over) drag.over.classList.remove("hot"); if(over) over.classList.add("hot"); drag.over = over; }
  });
  const end = e => {
    if(!drag) return; const d = drag; drag = null;
    if(d.over) d.over.classList.remove("hot");
    if(d.ghost){ d.ghost.remove(); if(d.over) fillGap(+d.over.dataset.gap, d.b, null); return; }
    let g = game.r2a; if(g===null || g<0 || game.r2[g]!==null) g = game.r2.indexOf(null);
    if(g>=0) fillGap(g, d.b, d.chip);
  };
  st.addEventListener("pointerup", end); st.addEventListener("pointercancel", () => { if(drag){ drag.ghost?.remove(); drag.over?.classList.remove("hot"); drag = null; } });
}
wireChips();
function checkR2(){ return game.r2.map((b,g) => ({ ok: b===SOL.m2[g], b })); }
async function revealR2(st, res, onPoint){
  st.innerHTML = `<div class="phone"><div class="ptop"><div class="gav">${Object.values(PEOPLE).map(p=>`<img class="av-img" src="${avURL(p[1],60)}" alt="">`).join("")}</div><div><b>Presentation group</b><small>Corrections</small></div></div>
    <div class="msgs">${CHAT.map(([who,parts,time]) => { const me = who==="Jules";
      return `<div class="msgrow ${me?"me":""}" style="animation:none"><img class="av-img" src="${avURL(PEOPLE[who][1],56)}" alt=""><div class="msg" style="--c:${PEOPLE[who][0]}"><div class="who">${who}${me?" (you)":""}</div>
      <div class="txt">${parts.map(p => { if(typeof p!=="number") return esc(p); const r = res[p];
        return `<span class="gapmark reveal ${r.ok?"ok":""}" data-g="${p}">${r.ok ? `<span class="okword">${esc(BANK[r.b])}</span>` : `<span class="yours">${r.b===null?"(blank)":esc(BANK[r.b])}</span><span class="fix">${esc(BANK[SOL.m2[p]])}</span>`}</span>`; }).join("")}</div><div class="time">${time}</div></div></div>`; }).join("")}</div></div>`;
  const marks = [...Array(7).keys()].map(g => st.querySelector(`[data-g="${g}"]`));
  for(let i=0;i<7;i++){ await sleep(260); marks[i].classList.add("on"); if(res[i].ok) onPoint(); }
  await sleep(250);
}

/* ---------- Round 3: Finish the Search ---------- */
function mountR3(st){
  st.innerHTML = `<div class="search"><div class="sdots" id="sdots">${STARTS.map((_,i)=>`<button class="sdot" data-dot="${i}" aria-label="Search ${i+1}">${i+1}</button>`).join("")}</div>
    <div class="sbox" id="sbox"></div><div class="stip" id="stip"></div></div>`;
  $("#sdots").addEventListener("click", e => { const b = e.target.closest("[data-dot]"); if(b) showSearch(+b.dataset.dot); });
  showSearch(game.r3i);
}
let typeTimer = null;
function r3Progress(){ const n = game.r3.filter(v=>v!==null).length; progress(n, 8, `${n}/8 searches done`);
  $$(".sdot").forEach((d,i)=>{ d.classList.toggle("done", game.r3[i]!==null); d.classList.toggle("cur", i===game.r3i); }); }
function showSearch(i){
  game.r3i = i; clearTimeout(typeTimer);
  const text = STARTS[i], box = $("#sbox"), pick = game.r3[i];
  box.innerHTML = `<div class="sbar"><span class="mag">🔍</span><span class="q"><span id="typed"></span><span class="pick" id="pickTxt"></span><span class="caret"></span></span></div>
    <div class="sugs" id="sugs">${R3OPTS[i].map(o=>`<button class="sug ${pick===o?"chosen":""}" data-opt="${o}"><span class="mg">🔍</span><span>${esc(text)} <b>${esc(ENDS[o])}</b></span></button>`).join("")}</div>`;
  $("#stip").textContent = `Search ${i+1} of 8`;
  const typed = $("#typed"); let k = 0;
  const showSugs = () => { if(pick!==null) $("#pickTxt").textContent = " " + ENDS[pick]; $$(".sug").forEach((s,j)=>setTimeout(()=>s.classList.add("in"), REDUCED?0:j*70)); };
  if(REDUCED || pick!==null){ typed.textContent = text; showSugs(); }
  else { const step = () => { typed.textContent = text.slice(0, ++k); if(k < text.length) typeTimer = setTimeout(step, 28); else showSugs(); }; step(); }
  $("#sugs").onclick = e => {
    const b = e.target.closest("[data-opt]"); if(!b || game.scores[2]!==null) return;
    game.r3[i] = +b.dataset.opt; $$(".sug").forEach(s => s.classList.toggle("chosen", s===b)); $("#pickTxt").textContent = " " + ENDS[game.r3[i]]; r3Progress();
    const nxt = [...Array(8).keys()].map(k => (i+1+k)%8).find(k => game.r3[k]===null);
    setTimeout(() => { if(game && game.step===2 && game.scores[2]===null){ if(nxt!==undefined) showSearch(nxt); else $("#abBtn").focus(); } }, REDUCED?0:450);
  };
  r3Progress();
}
function checkR3(){ return game.r3.map((o,i) => ({ ok: o===SOL.m4[i], o })); }
async function revealR3(st, res, onPoint){
  st.innerHTML = `<div class="r3res">${STARTS.map((s,i)=>{ const r = res[i];
    return `<div class="r3row reveal ${r.ok?"ok":"no"}"><span class="st">🔍 ${esc(s)}</span>
      ${r.ok ? `<span class="okword">${esc(ENDS[r.o])}</span>` : `<span class="yours">${r.o===null?"(blank)":esc(ENDS[r.o])}</span><span class="fix">${esc(ENDS[SOL.m4[i]])}</span>`}
      <span class="verdict ${r.ok?"ok":"no"}" style="margin-left:auto">${r.ok?"Correct":"Incorrect"}</span></div>`; }).join("")}</div>`;
  await revealSeq($$(".r3row"), res, onPoint);
}

/* ================= FINISH + LEADERBOARD ================= */
async function finish(){
  game.tEnd = Date.now(); clearInterval(timerId); tick();
  const ms = game.tEnd - game.t0, sc = total();
  $("#resultBox").innerHTML = `<div class="label">Your result</div><div class="big"><span id="countUp">0</span><small>/21</small></div><div class="rank" id="rankLine">&nbsp;</div>
    <div class="statrow">${ROUNDS.map((r,i)=>`<div class="stat"><b>${game.scores[i]}/${r.pts}</b><span>${r.icon} ${r.title}</span></div>`).join("")}<div class="stat"><b>${fmt(ms)}</b><span>⏱ Time</span></div></div>`;
  $("#resultBox").classList.remove("hidden"); show("sBoard"); hud(false);
  for(let i=1;i<=sc;i++){ await sleep(45); $("#countUp").textContent = i; }
  if(sc >= 16) boom(true);
  game.myId = await saveScore({ name:player.name, avatar:player.avatar, score:sc, time_ms:ms });
  loadBoard(game.myId);
}
let lastError = "";
async function saveScore(row){
  if(ONLINE){ try{
      const r = await fetch(`${API}/rest/v1/${TABLE}`, { method:"POST", headers:{ ...authHeaders(), "Content-Type":"application/json", Prefer:"return=representation" }, body: JSON.stringify(row) });
      if(!r.ok) throw new Error(await r.text()); const [saved] = await r.json(); return "db-"+saved.id;
    }catch(err){ console.error(err); lastError = "Your score couldn’t be saved online."; } }
  const all = store.get("ie-scores", []); const id = "local-"+Date.now(); all.push({ ...row, id, created_at:new Date().toISOString() }); store.set("ie-scores", all); return id;
}
async function fetchScores(){
  if(ONLINE){ try{
      const r = await fetch(`${API}/rest/v1/${TABLE}?select=id,name,avatar,score,time_ms&order=score.desc,time_ms.asc&limit=500`, { headers:authHeaders() });
      if(!r.ok) throw new Error(await r.text()); return (await r.json()).map(x=>({ ...x, id:"db-"+x.id }));
    }catch(err){ console.error(err); lastError = "The leaderboard couldn’t be loaded."; return []; } }
  return store.get("ie-scores", []);
}
async function loadBoard(myId){
  lastError = "";
  const rows = await fetchScores(); rows.sort((a,b)=> b.score-a.score || a.time_ms-b.time_ms);
  const best = new Map(); for(const r of rows){ const k = r.name.trim().toLowerCase(); if(!best.has(k)) best.set(k, r); }
  const ranked = [...best.values()];
  const mine = myId && rows.find(r=>r.id===myId); const meKey = mine ? mine.name.trim().toLowerCase() : null;
  const isMe = r => meKey && r.name.trim().toLowerCase()===meKey;
  $("#podium").innerHTML = [1,0,2].map(i => { const r = ranked[i], cls = ["p1","p2","p3"][i];
    if(!r) return `<div class="pod ${cls} empty"><div class="avw"><span class="emo">?</span></div><div class="nm muted">Open</div><div class="block">${i+1}</div></div>`;
    return `<div class="pod ${cls} ${isMe(r)?"me":""}"><div class="avw">${i===0?'<span class="crown">👑</span>':""}${avHTML(r.avatar,"av-img",160)}</div>
      <div class="nm" title="${esc(r.name)}">${esc(r.name)}</div><div class="sc">${r.score}/21</div><div class="tm">⏱ ${fmt(r.time_ms)}</div><div class="block">${i+1}</div></div>`; }).join("");
  $("#list").innerHTML = ranked.slice(3,50).map((r,k)=>`<div class="lrow ${isMe(r)?"me":""}" style="animation-delay:${k*40}ms"><span class="rk">${k+4}</span>${avHTML(r.avatar,"av-img",72)}
    <span class="nm">${esc(r.name)}</span><span class="sc">${r.score}</span><span class="tm">${fmt(r.time_ms)}</span></div>`).join("");
  if(meKey && $("#rankLine")){ const pos = ranked.findIndex(isMe); if(pos>=0) $("#rankLine").textContent = ranked[pos].id===mine.id ? `You’re #${pos+1} of ${ranked.length}` : `Your best run is still #${pos+1} of ${ranked.length}`; }
  $("#modeNote").textContent = lastError || (ONLINE ? "Best run per name counts." : "Local mode: scores are saved in this browser only.");
  $("#modeNote").className = "note" + (lastError || !ONLINE ? " warn" : "");
}
